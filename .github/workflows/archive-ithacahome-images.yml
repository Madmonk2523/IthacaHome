name: Archive IthacaHome photos before Wix retirement
on:
  push:
    paths:
      - '.github/workflows/archive-ithacahome-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Save original business images locally to repository
        shell: bash
        run: |
          mkdir -p assets/property-gallery
          cat > /tmp/property-images.txt <<'IMAGES'
          plaza-01.webp https://static.wixstatic.com/media/2f6185_cd315b25485044c18e941701754ddd00~mv2.jpg
          plaza-02.webp https://static.wixstatic.com/media/2f6185_288d55dfb8134f74ac454047c3e327f9~mv2.jpg
          plaza-03.webp https://static.wixstatic.com/media/2f6185_ca85e836e3694c58b974aedb35696da2~mv2.jpg
          plaza-04.webp https://static.wixstatic.com/media/2f6185_94ae1da1385c4196bcc903dee8265084~mv2.jpg
          plaza-05.webp https://static.wixstatic.com/media/2f6185_39c9c34099c04049ab2fabc3b5445ae6~mv2.jpg
          plaza-06.webp https://static.wixstatic.com/media/2f6185_39b94d43aec84ee5bc38f067d28893d8~mv2.jpg
          plaza-07.webp https://static.wixstatic.com/media/2f6185_cd1c270530ea4e9bab1789e806f510ae~mv2.jpg
          plaza-08.webp https://static.wixstatic.com/media/2f6185_b2812f4778744519a607680563c174ff~mv2.jpg
          plaza-09.webp https://static.wixstatic.com/media/2f6185_bb4e92394b384f01a9027b30fc187b45~mv2.jpg
          plaza-10.webp https://static.wixstatic.com/media/2f6185_7598c30a4e344303bd0b62519ad6c5f0~mv2.jpg
          plaza-11.webp https://static.wixstatic.com/media/2f6185_4f71d9adb7af4966adcba6b679b3830e~mv2.jpg
          plaza-12.webp https://static.wixstatic.com/media/2f6185_b696e3e8eb3245eeafb9efa5f226d523~mv2.jpg
          summerhill-01.webp https://static.wixstatic.com/media/2f6185_b098a00bedbd4d3b9327a83d5acff588~mv2.jpg
          summerhill-02.webp https://static.wixstatic.com/media/2f6185_4d8f8fce311b49fdacfda6d1515647d6~mv2.jpg
          summerhill-03.webp https://static.wixstatic.com/media/2f6185_37fe0bbe462e40bda27029f938e4d0a7~mv2.jpeg
          summerhill-04.webp https://static.wixstatic.com/media/2f6185_c45d775cb3994c62887f6725de820176~mv2.jpg
          summerhill-05.webp https://static.wixstatic.com/media/2f6185_404f663e6ea745738410ff87a87386d2~mv2.jpg
          summerhill-06.webp https://static.wixstatic.com/media/2f6185_15b6dd74aaf94273bf36295decd8725e~mv2.jpg
          summerhill-07.webp https://static.wixstatic.com/media/2f6185_c876491d1b7843ad8abf8c5351f32cf2~mv2.jpg
          summerhill-08.webp https://static.wixstatic.com/media/2f6185_f65451763aae4dd9b94b8e451eef6488~mv2.jpg
          summerhill-09.webp https://static.wixstatic.com/media/2f6185_e9b8d6a9a171465e9b01561e1fa153cb~mv2.jpg
          summerhill-10.webp https://static.wixstatic.com/media/2f6185_5c75ddfdd7f541e1975e821800930733~mv2.jpg
          IMAGES
          python - <<'PY'
          import io, pathlib, urllib.request, hashlib
          from PIL import Image, ImageOps
          dest=pathlib.Path('assets/property-gallery')
          saved=0; errors=[]
          for line in pathlib.Path('/tmp/property-images.txt').read_text().splitlines():
              fn,url=line.strip().split(' ',1)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      raw=response.read(12000000)
                  im=Image.open(io.BytesIO(raw))
                  im=ImageOps.exif_transpose(im).convert('RGB')
                  if min(im.size)<350: raise ValueError('unexpectedly small image')
                  im.save(dest/fn,format='WEBP',quality=84,method=6)
                  saved+=1
              except Exception as e:
                  errors.append(f'{fn}: {type(e).__name__}: {str(e)[:100]}')
          pathlib.Path('PHOTO_ARCHIVE_REPORT.md').write_text('# Image archival report\\n\\n'+f'Archived {saved} of 22 Wix images.\\n\\n'+'\\n'.join(errors)+'\\n')
          print('Saved',saved,'images; errors:',errors)
          if saved < 10: raise SystemExit('Not enough images downloaded. Do not shut down Wix.')
          PY
      - name: Commit archived photographs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/property-gallery PHOTO_ARCHIVE_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m 'Self-host original property gallery photographs'
            git push
          fi
